bind -r -Tjason:naviorg z 'resize-pane -Z; switch-client -Tjason:noop'


# ===================
# repeat prefix table
# ===================
run-shell -C 'bind -r -Tjason:prefix #{q:prefix} "send-keys #{q:prefix}; switch-client -Tjason:reppre"'
run-shell -C 'bind -r -Tjason:reppre #{q:prefix} "send-keys #{q:prefix}"'
bind -r -Tjason:reppre Enter 'switch-client -Tjason:noop'

# ================
# Copy mode tweaks
# ================
# relative numbers
set-option -g @jason_copyrel_show 'ppos=.."${COLUMNS}"; '
set-option -g -a @jason_copyrel_show "while read lower upper cpos spos < <(tmux display -t '#{session_id}:#{window_id}.#{pane_id}'"
set-option -g -a @jason_copyrel_show " -p '##{scroll_region_lower} ##{scroll_region_upper} ##{copy_cursor_y} ##{scroll_position}'); "
set-option -g -a @jason_copyrel_show '[[ "${ppos}" = "${cpos}.${spos}.${COLUMNS}" || -n "${cpos}" ]]; do '
set-option -g -a @jason_copyrel_show   'if [[ "${ppos}" != "${cpos}.${spos}.${COLUMNS}" ]]; then '
set-option -g -a @jason_copyrel_show     'height=$((lower - upper)); '
set-option -g -a @jason_copyrel_show     'lno=$((spos + height - cpos)); '
set-option -g -a @jason_copyrel_show     'eval "nums=({$((cpos))..$((cpos-height))})"; '
set-option -g -a @jason_copyrel_show     'printf -v nums[cpos] "%${COLUMNS}s" "${lno}"; '
set-option -g -a @jason_copyrel_show     "printf '\\x1b[H'; "
set-option -g -a @jason_copyrel_show     'printf "%-${COLUMNS}s" "${nums[@]//-}"; '
set-option -g -a @jason_copyrel_show     'sleep 0.1; '
set-option -g -a @jason_copyrel_show   'else sleep 0.5; fi; '
set-option -g -a @jason_copyrel_show   'ppos="${cpos}.${spos}.${COLUMNS}"; '
set-option -g -a @jason_copyrel_show 'done; '
set-option -g -F @jason_copyrel_show "bash -i -c '#{s/'/'\\\\''/:@jason_copyrel_show}' || read"

set-option -g @jason_copyrel_command  'hlim="#{history_size}"; '
set-option -g -a @jason_copyrel_command 'if ((#{pane_at_left}'
set-option -g -a @jason_copyrel_command '  || (#{pane_height} != $(tmux display -p -t ".{left-of}" "##{pane_height}")) )); '
set-option -g -a @jason_copyrel_command 'then args=(-b); '
set-option -g -a @jason_copyrel_command 'else args=(-t "{left-of}"); fi; '
set-option -g -a @jason_copyrel_command 'tmux splitw "${args[@]}" -h -d -l "$((${##hlim}+2))" '
set-option -g -a -F @jason_copyrel_command "'#{s/'/'\\\\''/:@jason_copyrel_show}'; tmux copy-mode"
set-option -g -F @jason_copyrel_command "bash -i -c '#{s/'/'\\\\''/:@jason_copyrel_command}'"

run-shell -C "bind -T jason:prefix [ run-shell '#{s/'/'\\\\''/:@jason_copyrel_command}'"

# Emacs universal repeat argument.
bind -T copy-mode C-u 'command-prompt -N -p (repeat) "send -N \"%%%\""'

# goto-line at top instead of bottom.
bind -T copy-mode-vi : 'command-prompt -p "(goto line)" "send -X goto-line \"%%%\"; send -X page-down; send -X scroll-down"'
bind -T copy-mode g 'command-prompt -p "(goto line)" "send -X goto-line \"%%%\"; send -X page-down; send -X scroll-down"'

# Refresh copy-mode if binding does not exist.
run-shell 'tmux list-keys -T copy-mode r &>/dev/null || tmux bind -T copy-mode r "send-keys -X cancel; run-shell \"sleep 0.1\"; copy-mode"'
run-shell 'tmux list-keys -T copy-mode-vi r &>/dev/null || tmux bind -T copy-mode-vi r "send-keys -X cancel; run-shell \"sleep 0.1\"; copy-mode"'

# put current line at top of screen.
set-option -g @jason_line2top 'tgt=$((#{scroll_position} - #{copy_cursor_y})); '
set-option -g -a @jason_line2top 'tmux send -X goto-line $((tgt>0 ? tgt : 0)); '
set-option -g -a @jason_line2top 'tmux send -X top-line; '
set-option -g -a @jason_line2top 'if ((tgt<0)); '
set-option -g -a @jason_line2top 'then tmux send -N ${tgt:1}; tmux send -X cursor-down; '
set-option -g -a @jason_line2top 'fi'
set-option -g -F @jason_line2top "bash -c '#{s/'/'\\\\''/:@jason_line2top}'"
run-shell -C "bind -T copy-mode-vi z run-shell '#{s/'/'\\\\''/:@jason_line2top}'"

# ==============
# Extra bindings
# ==============
# Extend original pane selection duration
bind -Tjason:prefix q display-panes -d 0
# Set the current path.
bind -Tjason:prefix P 'attach-session -c "#{pane_current_path}"; display-message -d0 "new session_path: #{session_path}"'
# toggle mark instead of only set
bind -Tjason:prefix m 'run-shell -C "select-pane #{?pane_marked,-M,-m}"'
# allow lowercase e to equalize panes too
bind -Tjason:prefix e select-layout -E

# =======
# options
# =======
set-option -g key-table jason:root
# Extend the repeat duration
set-option -g repeat-time 5000
# Increase display-panes (in)active contrast.
set-option -g display-panes-active-colour '#ff0000'
set-option -g display-panes-colour '#000077'
# Because in the status line, ^[^[ causes tmux to crash
# so explicitly use emacs bindings for the status line.
set-option -g status-keys emacs
set-option -g mode-keys vi
# After some research, it seems that escape-time is mainly
# used for
# 1. allowing pressing escape, and then a key to activate M-*
# 2. ?allow M-* bindings in a remote terminal where keypresses
#    being sent might be split into separate packets which might
#    or might not be delayed resulting in a separate escape
#    and key instead of the M-* binding?
set-option -g escape-time 100

# =====================================
# Change prefix key for normal bindings
# =====================================
# Issues with the prefix key:
# 1. It does not interrupt repeat mode
# 2. It takes precedence over every binding
# This results in some issues:
# 1. no immediate prefix table bindings after a repeated keybind
# 2. Cannot use the prefix key for bindings in any table (except prefix table)
#
# Therefore, add a root table binding of prefix to the prefix table
# and then unset the prefix.
run-shell -C "bind -Tjason:root #{q:prefix} 'switch-client -Tjason:prefix'"
# Prefix bindings in copy modes but repeated prefix does the original copy-mode action
run-shell "tmux list-keys -Tjason:prefix | sed 's/-T *jason:prefix/-T jason:copy-mode-prefix/' | tmux source-file -"
run-shell "tmux list-keys -Tjason:prefix | sed 's/-T *jason:prefix/-T jason:copy-mode-vi-prefix/' | tmux source-file -"
run-shell "tmux list-keys -Tcopy-mode #{q:prefix} | sed 's/\\( -r\\)\\? *-T *copy-mode/ -r -T jason:copy-mode-prefix/' | tmux source-file -"
run-shell "tmux list-keys -Tcopy-mode-vi #{q:prefix} | sed 's/\\( -r\\)\\? *-T *copy-mode-vi/ -r -T jason:copy-mode-vi-prefix/' | tmux source-file -"
run-shell -C "bind -Tcopy-mode #{q:prefix} 'switch-client -Tjason:copy-mode-prefix'"
run-shell -C "bind -Tcopy-mode-vi #{q:prefix} 'switch-client -Tjason:copy-mode-vi-prefix'"

set-option -g prefix None


# ===============
# remote ssh tmux
# ===============
# I want my bindings for remote tmux session.
# I don't want to affect others' tmux sessions.
# Send this config via send-keys to add my settings
# without having my config being sourced by others.
# Solution:
# 1. make a binding in config
# 2. bind to sed current_file, removing -g from set-option and also exclude this remote binding.
# 3. use command-prompt to git the remote tmux prefix and send this config as a status-line command.

# NOTE: #{q:...} is sh only, not tmux trying to rely only on #{q:} will fail.
# sed command to convert the script into remote tmux commands separated by semicolon
set-option -g -F @remotecmd "sed -n '/^ *[^##]/ {/^.*remotecmd/! {s/set-option -g/set-option/g; p}}' #{q:current_file} | paste -s -d ';'"
set-option -g -F @remotecmd 'tmux send-keys -l "set prefix %1; $(#{@remotecmd})"; tmux send-keys "Enter"'
set-option -g -F @remotecmd "run-shell '#{s/'/'\\\\''/:@remotecmd}'"
set-option -g -F @remotecmd "command-prompt -k -p 'Desired remote prefix:' '#{s/'/'\\\\''/:@remotecmd}'"
set-option -g -F @remotecmd "#{s/%1/%''1/:@remotecmd}"
set-option -g -F @remotecmd "command-prompt -k -p 'Current remote prefix:' 'send-keys %1 :; #{s/'/'\\\\''/:@remotecmd}'"
run-shell -C "bind -T jason:prefix v '#{s/'/'\\\\''/:@remotecmd}'"

# because #{q:} must operate on a variable and not an expr
set-option -g -F @compatremotecmd '#{d:current_file}/compat_#{b:current_file}'
set-option -g -F @compatremotecmd "sed -n '/^ *[^##]/ {/^.*remotecmd/! {s/set-option -g/set-option/g; p}}' #{q:@compatremotecmd} | paste -s -d ';'"
set-option -g -F @compatremotecmd 'tmux send-keys -l "set prefix %1; $(#{@compatremotecmd})"; tmux send-keys "Enter"'
set-option -g -F @compatremotecmd "run-shell '#{s/'/'\\\\''/:@compatremotecmd}'"
set-option -g -F @compatremotecmd "command-prompt -k -p 'Desired remote prefix:' '#{s/'/'\\\\''/:@compatremotecmd}'"
set-option -g -F @compatremotecmd "#{s/%1/%''1/:@compatremotecmd}"
set-option -g -F @compatremotecmd "command-prompt -k -p 'Current remote prefix:' 'send-keys %1 :; #{s/'/'\\\\''/:@compatremotecmd}'"
run-shell -C "bind -T jason:prefix V '#{s/'/'\\\\''/:@compatremotecmd}'"
