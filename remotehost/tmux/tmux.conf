# Observations:
# However, having multiple sets of keys in the same table and repeatable
# means that unrelated movements will chain into eachother which is very
# likely to be unwanted behavior. Example: bind prefix=C-b with -r, then
# moving backwards with C-b, start typing something that is NOT C-b and
# happens to be bound with -r, its binding will be fired instead of just
# typing.
#
# Table names will be prefixed with "jason:" but will generally be referred
# to using only the latter half.


# NOTE: this original used %if, but %if cannot be used on the status line
# so use run-shell instead so this script can be forwarded via send-keys
# to get these settings on a remote ssh tmux server.
# ====================
# Ensure correct color
# ====================
# Tmux generally sets TERM to "screen" so some programs assume no color.
# If the original TERM has 256color in the name, then append -256color
# to the #{default-terminal}
# if [[ 'X' = *256color* && 'X' != *256color* ]]; then tmux set-option -g default-terminal 'X-256color'; tmux set-option -a terminal-overrides '*256color*:colors=256'; fi
# bash -c 'if [[ '\''X'\'' = *256color* && '\''X'\'' != *256color* ]]; then tmux set-option -g default-terminal '\''X-256color'\''; tmux set-option -a terminal-overrides '\''*256color*:colors=256'\''; fi'
run-shell 'bash -c '\''if [[ '\''\'\'\'"$TERM"\''\'\'\'' = *256color* && '\''\'\'\''#{default-terminal}'\''\'\'\'' != *256color* ]]; then tmux set-option -g default-terminal '\''\'\'\''#{default-terminal}-256color'\''\'\'\''; tmux set-option -a terminal-overrides '\''\'\'\''*256color*:colors=256'\''\'\'\''; fi'\'

# =============
# Ensure prefix
# =============
# Set prefix to C-b if None so that its value can be used directly in following bindings.
# if [[ 'X' = None ]]; then tmux set-option -g prefix C-b; fi
# bash -c 'if [[ '\''X'\'' = None ]]; then tmux set-option -g prefix C-b; fi'
run-shell 'bash -c '\''if [[ '\''\'\'\''#{prefix}'\''\'\'\'' = None ]]; then echo tmux set-option -g prefix C-b; fi'\'

# =====================
# Duplicate base tables
# =====================
run-shell 'tmux list-keys -Troot | sed "s/-T *root/-T jason:root/" | tmux source -'
run-shell 'tmux list-keys -Tprefix | sed "s/-T *prefix/-T jason:prefix/" | tmux source -'
run-shell 'tmux list-keys -Tcopy-mode | sed "s/-T *copy-mode/-T jason:copy-mode/" | tmux source -'
run-shell 'tmux list-keys -Tcopy-mode-vi | sed "s/-T *copy-mode-vi/-T jason:copy-mode-vi/" | tmux source -'
run-shell -C 'unbind -Tjason:prefix C-b'

# =========================
# Noop table to end repeats
# =========================
bind -Tjason:noop a 'send-keys a'

# =======================
# navigation/organization
# =======================
# The bind table is called "naviorg" short for navigation/organization.
# The keys that enter the naviorg table:
# * C-n   Do nothing
# * hjkl  Move left down up right one pane
# * HJKL  Swap current pane left down up right one pane
# * oO    Step through next/previous pane
# * np    next/previous window
#
# These keys have the same meaning within the naviorg table.  While in the
# naviorg table, display-panes will display the pane numbers until repeat-time
# expires so as long as the numbers are visible, the naviorg keys can be
# repeated without any prefix key.
#
# In addition to the above, the naviorg table also has these bindings:
# * 1-7    select layouts (horz vert, mainhorz, mainvert, tiled, mainhorz-rev mainvertrev)
# * Space  3 possible functions:
#          1. mark the pane if no panes are marked
#          2. Unmark the pane if it is already marked
#          3. Swap the current pane and marked pane if there is a marked pane.
# * v      join marked pane with current pane vertically
# * V      join marked pane with current pane horizontally
# * !      break current pane into new window
# * %"     split pane horizontally/vertically
# * c      new window
# * eE     equalize adjacent panes
# * wasd   resize current pane
# * WASD   resize current pane faster
# * Escape Remove mark if any marked panes.  Otherwise, exit naviorg table.
# * Enter  swap windows if mark exists.  Otherwise, exit naviorg table.
# * z      Zoom the current pane and exit naviorg table
#
bind -r -Tjason:prefix C-n 'switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix o 'select-pane -t "+"; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix O 'select-pane -t "-"; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix h 'select-pane -L; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix j 'select-pane -D; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix k 'select-pane -U; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix l 'select-pane -R; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix H 'swap-pane -d -t "{left-of}"; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix J 'swap-pane -d -t "{down-of}"; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix K 'swap-pane -d -t "{up-of}"; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix L 'swap-pane -d -t "{right-of}"; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix n 'next-window; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:prefix p 'previous-window; switch-client -Tjason:naviorg; run-shell -C "display-panes -N -d #{repeat-time}"'

bind -r -Tjason:naviorg o 'select-pane -t "+"; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg O 'select-pane -t "-"; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg h 'select-pane -L; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg j 'select-pane -D; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg k 'select-pane -U; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg l 'select-pane -R; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg H 'swap-pane -d -t "{left-of}"; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg J 'swap-pane -d -t "{down-of}"; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg K 'swap-pane -d -t "{up-of}"; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg L 'swap-pane -d -t "{right-of}"; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg n 'next-window; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg p 'previous-window; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg 1 'select-layout even-horizontal; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg 2 'select-layout even-vertical; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg 3 'select-layout main-horizontal; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg 4 'select-layout main-vertical; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg 5 'select-layout tiled; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg 6 'select-layout main-horizontal-mirrored; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg 7 'select-layout main-vertical-mirrored; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg Space 'run-shell -C "#{?pane_marked,select-pane -M,#{?pane_marked_set,swap-pane -d; select-pane -M,select-pane -m}}; display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg v 'run-shell -C "#{?#{!=:#{pane_marked_set},#{pane_marked}},joinp -v;,}display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg V 'run-shell -C "#{?#{!=:#{pane_marked_set},#{pane_marked}},joinp -h;,}display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg ! 'run-shell -C "breakp; display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg % 'split-window -h; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg '"' 'split-window -v; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg c 'new-window; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg e 'select-layout -E; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg E 'select-layout -E; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg w 'resize-pane -U; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg s 'resize-pane -D; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg a 'resize-pane -L; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg d 'resize-pane -R; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg W 'resize-pane -U 5; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg S 'resize-pane -D 5; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg A 'resize-pane -L 5; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg D 'resize-pane -R 5; run-shell -C "display-panes -N -d #{repeat-time}"'
bind -r -Tjason:naviorg Escape 'run-shell -C "#{?pane_marked_set,select-pane -M; display-panes -N -d #{repeat-time},switch-client -Tjason:noop}"'
bind -r -Tjason:naviorg Enter 'run-shell -C "#{?#{==:#{window_marked_flag},#{pane_marked_set}},switch-client -Tjason:noop,swap-window; display-panes -N -d #{repeat-time}}"'
bind -r -Tjason:naviorg z 'resize-pane -Z; switch-client -Tjason:noop'


# ===================
# repeat prefix table
# ===================
run-shell -C 'bind -r -Tjason:prefix #{q:prefix} "send-keys #{q:prefix}; switch-client -Tjason:reppre"'
run-shell -C 'bind -r -Tjason:reppre #{q:prefix} "send-keys #{q:prefix}"'
bind -r -Tjason:reppre Enter 'switch-client -Tjason:noop'

# ==============
# Extra bindings
# ==============
# Extend original pane selection duration
bind -Tjason:prefix q display-panes -d 0
# Set the current path.
bind -Tjason:prefix P 'attach-session -c "#{pane_current_path}"; display-message -d0 "new session_path: #{session_path}"'
# toggle mark instead of only set
bind -Tjason:prefix m 'run-shell -C "select-pane #{?pane_marked,-M,-m}"'
# allow lowercase e to equalize panes too
bind -Tjason:prefix e select-layout -E

# =======
# options
# =======
set-option -g key-table jason:root
# Extend the repeat duration
set-option -g repeat-time 5000
# Increase display-panes (in)active contrast.
set-option -g display-panes-active-colour '#ff0000'
set-option -g display-panes-colour '#000077'
# Because in the status line, ^[^[ causes tmux to crash
# so explicitly use emacs bindings for the status line.
set-option -g status-keys emacs
set-option -g mode-keys vi
# After some research, it seems that escape-time is mainly
# used for
# 1. allowing pressing escape, and then a key to activate M-*
# 2. ?allow M-* bindings in a remote terminal where keypresses
#    being sent might be split into separate packets which might
#    or might not be delayed resulting in a separate escape
#    and key instead of the M-* binding?
set-option -g escape-time 100

# =====================================
# Change prefix key for normal bindings
# =====================================
# Issues with the prefix key:
# 1. It does not interrupt repeat mode
# 2. It takes precedence over every binding
# This results in some issues:
# 1. no immediate prefix table bindings after a repeated keybind
# 2. Cannot use the prefix key for bindings in any table (except prefix table)
#
# Therefore, add a root table binding of prefix to the prefix table
# and then unset the prefix.
run-shell -C "bind -Tjason:root #{q:prefix} 'switch-client -Tjason:prefix'"
# Allow prefix bindings in copy modes
run-shell "tmux list-keys -Tjason:prefix | sed 's/-T *jason:prefix/-T jason:copy-mode-prefix/' | tmux source-file -"
run-shell "tmux list-keys -Tjason:prefix | sed 's/-T *jason:prefix/-T jason:copy-mode-vi-prefix/' | tmux source-file -"
# Set the prefix binding to whatever the original copy-mode binding was but make it repeatable too
run-shell "tmux list-keys -Tcopy-mode #{q:prefix} | sed 's/\\( -r\\)\\? *-T *copy-mode/ -r -T jason:copy-mode-prefix/' | tmux source-file -"
run-shell "tmux list-keys -Tcopy-mode-vi #{q:prefix} | sed 's/\\( -r\\)\\? *-T *copy-mode-vi/ -r -T jason:copy-mode-vi-prefix/' | tmux source-file -"
# prefix in copymode goes to the new copy-mode*-prefix tables
run-shell -C "bind -Tcopy-mode #{q:prefix} 'switch-client -Tjason:copy-mode-prefix'"
run-shell -C "bind -Tcopy-mode-vi #{q:prefix} 'switch-client -Tjason:copy-mode-vi-prefix'"

set-option -g prefix None


# ===============
# remote ssh tmux
# ===============
# I want my bindings for remote tmux session.
# I don't want to affect others' tmux sessions.
# Send this config via send-keys to add my settings
# without having my config being sourced by others.
# Solution:
# 1. make a binding in config
# 2. bind to sed current_file, removing -g from set-option and also exclude this remote binding.
# 3. use command-prompt to git the remote tmux prefix and send this config as a status-line command.

# sed -n '/^ *[^#]/ {/^.*Current remote prefix/! {s/set-option -g/set-option/g; p}}' #{current_file} | paste -s -d ';'
# tmux send-keys "set prefix %1; $(sed -n '/^ *[^#]/ {/^.*Current remote prefix/! {s/set-option -g/set-option/g; p}}' #{current_file} | paste -s -d ';')"
# run-shell 'tmux send-keys "set prefix %1; $(sed -n '\''/^ *[^#]/ {/^.*Current remote prefix/! {s/set-option -g/set-option/g; p}}'\'' #{current_file} | paste -s -d '\'';'\'')"'
# command-prompt -k -p 'Desired remote prefix' 'run-shell '\''tmux send-keys "set prefix %1; $(sed -n '\''\'\'\''/^ *[^#]/ {/^.*Current remote prefix/! {s/set-option -g/set-option/g; p}}'\''\'\'\'' #{current_file} | paste -s -d '\''\'\'\'';'\''\'\'\'')"'\'''

# NOTE: command-prompt seems like it immediately executs the next command
# However, if the next command is another command-prompt command, it just seems to
# get canceled.  As a result, insert a display-panes -d 0 in between to delay the next
# command-prompt command until a key has been pressed.

bind -Tjason:prefix v command-prompt -k -p 'Current remote prefix:' 'send-keys %1 :'\; display-panes -d 0\; $command-prompt -k -p 'Desired remote prefix' 'run-shell '\''tmux send-keys "set prefix %1; $(sed -n '\''\'\'\''/^ *[^#]/ {/^.*Current remote prefix/! {s/set-option -g/set-option/g; p}}'\''\'\'\'' #{current_file} | paste -s -d '\''\'\'\'';'\''\'\'\'')"'\'''\; send-keys "\n"
