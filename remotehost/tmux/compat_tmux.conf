# Same as tmux.conf but use compatible syntax with old tmux version
# Issue:
#	run-shell does not have a -C option
# solution:
#	use tmux command instead of -C to run directly.
# Issue:
#	source cannot read stdin, nor can it read from a process substitution.
#	fifo also causes tmux to stall.
# solution:
#	use temp file.
# Issue:
#	display-message has no -d argument
# solution:
#	don't use it.
# Issue:
#	display-panes does not have -N option
# solution:
#	Use display-message to indicate repeat-time not expired.
# Issue:
#	window_marked_flag does not exist
# solution:
# 	use pane_marked instead...

# ====================
# Ensure correct color
# ====================
run-shell 'bash -c '\''if [[ '\''\'\'\'"$TERM"\''\'\'\'' = *256color* && '\''\'\'\''#{default-terminal}'\''\'\'\'' != *256color* ]]; then tmux set-option -g default-terminal '\''\'\'\''#{default-terminal}-256color'\''\'\'\''; tmux set-option -a terminal-overrides '\''\'\'\''*256color*:colors=256'\''\'\'\''; fi'\'

# =============
# Ensure prefix
# =============
run-shell 'bash -c '\''if [[ '\''\'\'\''#{prefix}'\''\'\'\'' = None ]]; then tmux set-option -g prefix C-b; fi'\'

# =====================
# Duplicate base tables
# =====================
run-shell 'tmux list-keys -Troot | sed '\''s/-T *root/-T jason:root/'\'' > $$; tmux source $$; rm $$'
run-shell 'tmux list-keys -Tprefix | sed '\''s/-T *prefix/-T jason:prefix/'\'' > $$; tmux source $$; rm $$'
run-shell 'tmux list-keys -Tcopy-mode | sed '\''s/-T *copy-mode/-T jason:copy-mode/'\'' > $$; tmux source $$; rm $$'
run-shell 'tmux list-keys -Tcopy-mode-vi | sed '\''s/-T *copy-mode-vi/-T jason:copy-mode-vi/'\'' >$$; tmux source $$; rm $$'
unbind -Tjason:prefix C-b

# =========================
# Noop table to end repeats
# =========================
bind -Tjason:noop a 'send-keys a'

# =======================
# navigation/organization
# =======================
# The bind table is called "naviorg" short for navigation/organization.
# The keys that enter the naviorg table:
# * C-n   Do nothing
# * hjkl  Move left down up right one pane
# * HJKL  Swap current pane left down up right one pane
# * oO    Step through next/previous pane
# * np    next/previous window
#
# These keys have the same meaning within the naviorg table.  While in the
# naviorg table, display-panes will display the pane numbers until repeat-time
# expires so as long as the numbers are visible, the naviorg keys can be
# repeated without any prefix key.
#
# In addition to the above, the naviorg table also has these bindings:
# * 1-7    select layouts (horz vert, mainhorz, mainvert, tiled, mainhorz-rev mainvertrev)
# * Space  3 possible functions:
#          1. mark the pane if no panes are marked
#          2. Unmark the pane if it is already marked
#          3. Swap the current pane and marked pane if there is a marked pane.
# * v      join marked pane with current pane vertically
# * V      join marked pane with current pane horizontally
# * !      break current pane into new window
# * %"     split pane horizontally/vertically
# * c      new window
# * eE     equalize adjacent panes
# * wasd   resize current pane
# * WASD   resize current pane faster
# * Escape Remove mark if any marked panes.  Otherwise, exit naviorg table.
# * Enter  swap windows if mark exists.  Otherwise, exit naviorg table.
# * z      Zoom the current pane and exit naviorg table
bind -r -Tjason:prefix C-n 'switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix o 'select-pane -t "+"; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix O 'select-pane -t "-"; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix h 'select-pane -L; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix j 'select-pane -D; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix k 'select-pane -U; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix l 'select-pane -R; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix H 'swap-pane -d -t "{left-of}"; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix J 'swap-pane -d -t "{down-of}"; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix K 'swap-pane -d -t "{up-of}"; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix L 'swap-pane -d -t "{right-of}"; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix n 'next-window; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:prefix p 'previous-window; switch-client -Tjason:naviorg; run-shell "tmux display-message bindrepeat"'

bind -r -Tjason:naviorg o 'select-pane -t "+"; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg O 'select-pane -t "-"; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg h 'select-pane -L; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg j 'select-pane -D; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg k 'select-pane -U; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg l 'select-pane -R; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg H 'swap-pane -d -t "{left-of}"; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg J 'swap-pane -d -t "{down-of}"; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg K 'swap-pane -d -t "{up-of}"; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg L 'swap-pane -d -t "{right-of}"; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg n 'next-window; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg p 'previous-window; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg 1 'select-layout even-horizontal; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg 2 'select-layout even-vertical; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg 3 'select-layout main-horizontal; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg 4 'select-layout main-vertical; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg 5 'select-layout tiled; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg 6 'select-layout main-horizontal-mirrored; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg 7 'select-layout main-vertical-mirrored; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg Space 'run-shell "tmux #{?pane_marked,select-pane -M,#{?pane_marked_set,swap-pane -d; select-pane -M,select-pane -m}}; tmux display-message bindrepeat"'
bind -r -Tjason:naviorg v 'run-shell "tmux #{?#{!=:#{pane_marked_set},#{pane_marked}},joinp -v; tmux ,}display-message bindrepeat"'
bind -r -Tjason:naviorg V 'run-shell "tmux #{?#{!=:#{pane_marked_set},#{pane_marked}},joinp -h; tmux ,}display-message bindrepeat"'
bind -r -Tjason:naviorg ! 'run-shell "tmux breakp; tmux display-message bindrepeat"'
bind -r -Tjason:naviorg % 'split-window -h; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg '"' 'split-window -v; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg c 'new-window; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg e 'select-layout -E; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg E 'select-layout -E; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg w 'resize-pane -U; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg s 'resize-pane -D; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg a 'resize-pane -L; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg d 'resize-pane -R; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg W 'resize-pane -U 5; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg S 'resize-pane -D 5; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg A 'resize-pane -L 5; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg D 'resize-pane -R 5; run-shell "tmux display-message bindrepeat"'
bind -r -Tjason:naviorg Escape 'run-shell "#{?pane_marked_set,tmux select-pane -M; tmux display-message bindrepeat,tmux switch-client -Tjason:noop}"'
bind -r -Tjason:naviorg Enter 'run-shell "#{?#{==:#{pane_marked},#{pane_marked_set}},tmux switch-client -Tjason:noop,tmux swap-window; tmux select-pane -M; tmux display-message bindrepeat}"'
bind -r -Tjason:naviorg z 'resize-pane -Z; switch-client -Tjason:noop'


# ===================
# repeat prefix table
# ===================
run-shell 'tmux bind -r -Tjason:prefix "#{q:prefix}" "send-keys #{q:prefix}; switch-client -Tjason:reppre"'
run-shell 'tmux bind -r -Tjason:reppre "#{q:prefix}" "send-keys #{q:prefix}"'
bind -r -Tjason:reppre Enter 'switch-client -Tjason:noop'

# ==============
# Extra bindings
# ==============
# Extend original pane selection duration
bind -Tjason:prefix q display-panes -d 0
# Set the current path.
bind -Tjason:prefix P 'attach-session -c "#{pane_current_path}"; display-message "new session_path: #{session_path}"'
# toggle mark instead of only set
bind -Tjason:prefix m 'run-shell "tmux select-pane #{?pane_marked,-M,-m}"'
# allow lowercase e to equalize panes too
bind -Tjason:prefix e select-layout -E

# =======
# options
# =======
set-option -g key-table jason:root
# Extend the repeat duration
set-option -g repeat-time 5000
set-option -g display-time 5000
# Increase display-panes (in)active contrast.
set-option -g display-panes-active-colour '#ff0000'
set-option -g display-panes-colour '#000077'
# Because in the status line, ^[^[ causes tmux to crash
# so explicitly use emacs bindings for the status line.
set-option -g status-keys emacs
set-option -g mode-keys vi
# After some research, it seems that escape-time is mainly
# used for
# 1. allowing pressing escape, and then a key to activate M-*
# 2. ?allow M-* bindings in a remote terminal where keypresses
#    being sent might be split into separate packets which might
#    or might not be delayed resulting in a separate escape
#    and key instead of the M-* binding?
set-option -g escape-time 100

# =====================================
# Change prefix key for normal bindings
# =====================================
# Issues with the prefix key:
# 1. It does not interrupt repeat mode
# 2. It takes precedence over every binding
# This results in some issues:
# 1. no immediate prefix table bindings after a repeated keybind
# 2. Cannot use the prefix key for bindings in any table (except prefix table)
#
# Therefore, add a root table binding of prefix to the prefix table
# and then unset the prefix.
run-shell "tmux bind -Tjason:root '#{q:prefix}' 'switch-client -Tjason:prefix'"
# Allow prefix bindings in copy modes
run-shell 'tmux list-keys -Tjason:prefix | sed '\''s/-T *jason:prefix/-T jason:copy-mode-prefix/'\'' >$$; tmux source-file $$; rm $$'
run-shell 'tmux list-keys -Tjason:prefix | sed '\''s/-T *jason:prefix/-T jason:copy-mode-vi-prefix/'\'' >$$; tmux source-file $$; rm $$'
# Set the prefix binding to whatever the original copy-mode binding was but make it repeatable too
run-shell 'tmux list-keys -Tcopy-mode #{q:prefix} | sed '\''s/\\( -r\\)\\? *-T *copy-mode/ -r -T jason:copy-mode-prefix/'\'' >$$; tmux source-file $$; rm $$'
run-shell 'tmux list-keys -Tcopy-mode-vi #{q:prefix} | sed '\''s/\\( -r\\)\\? *-T *copy-mode-vi/ -r -T jason:copy-mode-vi-prefix/'\'' >$$; tmux source-file $$; rm $$'
# prefix in copymode goes to the new copy-mode*-prefix tables
run-shell 'tmux bind -Tcopy-mode '\''#{q:prefix}'\'' '\''switch-client -Tjason:copy-mode-prefix'\'
run-shell 'tmux bind -Tcopy-mode-vi '\''#{q:prefix}'\'' '\''switch-client -Tjason:copy-mode-vi-prefix'\'

set-option -g prefix None
